[package]
name = "admission_analysis"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio-native-tls", "macros"] }
chrono = "0.4"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
